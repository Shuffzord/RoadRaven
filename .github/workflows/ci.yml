name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least-privilege workflow token (W-02 fix). CI only reads code, runs tests,
# and lints — it never publishes, comments on PRs, or uploads release assets.
# Setting `contents: read` here protects against repos with default `write-all`
# token permissions and against future job additions that might inadvertently
# inherit broader scope.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      # `bun install` runs the workspace's postinstall, which calls
      # `bunx electrobun prepare` to materialize the gitignored
      # packages/desktop/.hutch/devkit/ (Electrobun 2.x's API source, not
      # published to node_modules). Cache Hutch's own toolchain store so
      # that doesn't re-download Hutch/Cottontail/CEF/Bun on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      - name: Verify @roadraven/core dependency allowlist (D-23, T-05-04)
        run: bun run scripts/check-core-deps.ts
      - run: bunx @biomejs/biome check --diagnostic-level=error .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      - run: bunx tsc --noEmit
        working-directory: packages/desktop
      - run: bun run test:typecheck:tests

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      - run: bunx vitest run
        working-directory: packages/desktop
      # Single file on purpose: installer-artifacts.test.ts in the same folder
      # throws under CI=true when no Electrobun build has produced artifacts.
      - name: Test install.sh against a fake release
        run: bunx vitest run tests/release/install-script.test.ts

  install-ps1:
    name: Test install.ps1 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      # This job needs only vitest, so skip the postinstall's Electrobun devkit
      # projection (Hutch toolchain download + symlinks) and use the standalone
      # release config: the root vitest.config.ts also loads packages/desktop's,
      # which imports that devkit.
      - run: bun install --ignore-scripts
      - name: Test install.ps1 against a fake release
        run: bunx vitest run --config tests/release/vitest.config.ts tests/release/install-ps1.test.ts

  e2e-ui:
    name: E2E (Playwright ui)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      # Browser binaries aren't part of bun's install cache; cache them
      # separately keyed on the lockfile so a pinned @playwright/test bump
      # invalidates it automatically.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
      - name: Install Playwright browser (Chromium)
        run: bunx playwright install --with-deps chromium
        working-directory: packages/desktop
      - name: E2E functional specs (ui project)
        run: bunx playwright test --project=ui tests/ui/canvas-focus.spec.ts tests/ui/keyboard-routing.spec.ts
        working-directory: packages/desktop
      # context-menu-50ms.spec.ts and canvas-drag-perf.spec.ts assert
      # wall-clock budgets (75ms dev ceiling / p95 <= 34ms) tuned on a
      # developer machine. Shared 2-vCPU GitHub runners are noisy enough to
      # flake them, so they run for signal only and must not block a merge.
      - name: E2E perf budgets (ui project, non-blocking)
        continue-on-error: true
        run: bunx playwright test --project=ui tests/ui/context-menu-50ms.spec.ts tests/ui/canvas-drag-perf.spec.ts tests/ui/canvas-large-tree-perf.spec.ts
        working-directory: packages/desktop
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/desktop/playwright-report/
            packages/desktop/test-results/
          retention-days: 7

  a11y:
    name: A11y (rendered contrast + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('**/bun.lock') }}
      - run: bun install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
      - name: Install Playwright browser (Chromium)
        run: bunx playwright install --with-deps chromium
        working-directory: packages/desktop
      # tests/a11y runs against the production bundle under `vite preview`:
      # the axe structure audit plus contrast.spec.ts, which reads the
      # computed colours of real elements per theme and gates them on the
      # shared pair registry (v0.8.3). Required-tier failures must be in
      # tests/a11y/known-failures.json; every ratio lands in the artifact.
      - name: Build renderer bundle
        run: bun run --cwd packages/desktop build
      - name: A11y specs (axe audit + rendered contrast)
        run: bun run --cwd packages/desktop test:a11y
      - name: Upload contrast report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: packages/desktop/test-results/
          retention-days: 7

  # TODO(fallow): enable once the branch is stable and the post-GSD dead-code
  # cleanup has landed. Intended as a non-blocking signal initially; flip to
  # `--fail-on-regression` after `bunx fallow --save-regression-baseline` is run
  # on a known-good commit.
