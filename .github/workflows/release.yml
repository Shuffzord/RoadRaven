name: Release

on:
  push:
    tags:
      # Stable semver only (v1.0.0, v1.0.1, v1.1.0). Pre-release tags
      # (v1.0.1-canary.0, v1.0.0-rc.1, etc.) are explicitly rejected here;
      # v1.1's canary channel will live in a separate workflow with its own
      # gating. Without this anchor a v*-canary.0 push would npm publish
      # --provenance and create a public Release with prerelease: false.
      - 'v[0-9]+.[0-9]+.[0-9]+'

# All jobs that publish or upload need explicit permissions (least-privilege).
# id-token: write — required for npm provenance OIDC token mint (R-03)
# contents: write — required for gh release create + asset upload
# attestations: write — required for actions/attest-build-provenance
# NOTE: deploy-docs job (Task 4) overrides these with pages-specific permissions.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      # `bun install` runs the workspace's postinstall, which calls
      # `bunx electrobun prepare` to materialize the gitignored
      # packages/desktop/.hutch/devkit/ (Electrobun 2.x's API source, not
      # published to node_modules). Cache Hutch's own toolchain store so
      # that doesn't re-download Hutch/Cottontail/CEF/Bun on every run.
      - name: Cache Hutch toolchain
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('**/bun.lock') }}
      - name: Install workspace dependencies
        run: bun install
      - name: Build webview bundle (vite build → packages/desktop/dist)
        run: bun run --cwd packages/desktop build
      - name: Build MCP server bundle (bun build → packages/desktop/assets/mcp)
        # Produces packages/desktop/assets/mcp/index.js, copied into the app
        # bundle by electrobun.config.ts so the Setup Wizard can install the
        # Claude Code MCP integration (v0.6).
        run: bun run --cwd packages/desktop build:mcp
      - name: Build Windows installer (stable channel)
        # Produces: packages/desktop/artifacts/win-x64-RoadRaven-Setup.zip
        #           packages/desktop/artifacts/stable-win-x64-update.json
        #           packages/desktop/artifacts/stable-win-x64-RoadRaven.tar.zst
        #           packages/desktop/artifacts/stable-win-x64-<hash>.patch (optional)
        # Names verified against electrobun@2.0.1 src/shared/naming.ts and a
        # real local build. The installer wrapper (.zip) OMITS the channel
        # prefix for "stable" builds (unlike 1.x); the updater triplet
        # (.tar.zst/update.json/.patch) keeps the full stable-win-x64- prefix.
        run: bunx electrobun build --env=stable
        working-directory: packages/desktop
      - name: Smoke-test installer artifact naming
        # Wave-0 test from Plan 05-01 — asserts artifact names match Pattern R-02
        run: bunx vitest run tests/release/installer-artifacts.test.ts
      - name: Upload installer + update manifest
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            packages/desktop/artifacts/win-x64-*.zip
            packages/desktop/artifacts/stable-win-x64-update.json
            packages/desktop/artifacts/stable-win-x64-*.tar.zst
            packages/desktop/artifacts/stable-win-x64-*.patch
          if-no-files-found: error

  build-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      # See build-windows: `bun install`'s postinstall runs `bunx electrobun
      # prepare`, which needs this cached to avoid re-downloading the Hutch
      # toolchain (Hutch/Cottontail/CEF/Bun) on every run.
      - name: Cache Hutch toolchain
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('**/bun.lock') }}
      - name: Install workspace dependencies
        run: bun install
      - name: Build webview bundle (vite build → packages/desktop/dist)
        run: bun run --cwd packages/desktop build
      - name: Build MCP server bundle (bun build → packages/desktop/assets/mcp)
        # Produces packages/desktop/assets/mcp/index.js, copied into the app
        # bundle by electrobun.config.ts so the Setup Wizard can install the
        # Claude Code MCP integration (v0.6).
        run: bun run --cwd packages/desktop build:mcp
      - name: Build Linux installer (stable channel)
        # Produces: packages/desktop/artifacts/linux-x64-RoadRaven-Setup.tar.gz
        #           packages/desktop/artifacts/stable-linux-x64-update.json
        #           packages/desktop/artifacts/stable-linux-x64-RoadRaven.tar.zst
        #           packages/desktop/artifacts/stable-linux-x64-<hash>.patch (optional)
        # NOTE per R-01: Electrobun ships .tar.gz, NOT .deb. Wave-0 test asserts no .deb.
        # The installer wrapper (.tar.gz) OMITS the channel prefix for "stable"
        # builds (unlike 1.x); the updater triplet (.tar.zst/update.json/.patch)
        # keeps the full stable-linux-x64- prefix. Names verified against
        # electrobun@2.0.1 src/shared/naming.ts.
        run: bunx electrobun build --env=stable
        working-directory: packages/desktop
      - name: Smoke-test installer artifact naming + .deb absence
        run: bunx vitest run tests/release/installer-artifacts.test.ts
      - name: Upload installer + update manifest
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            packages/desktop/artifacts/linux-x64-*.tar.gz
            packages/desktop/artifacts/stable-linux-x64-update.json
            packages/desktop/artifacts/stable-linux-x64-*.tar.zst
            packages/desktop/artifacts/stable-linux-x64-*.patch
          if-no-files-found: error

  github-release:
    name: Create GitHub Release with installers
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        # install.sh and package-manager manifests verify downloads against
        # this. Written outside the glob first so it never hashes itself.
        run: sha256sum * > ../SHA256SUMS && mv ../SHA256SUMS .
        working-directory: artifacts
      - name: Attest build provenance
        # Verify with: gh attestation verify <file> --repo Shuffzord/RoadRaven
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*
      - name: Create release and attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm-core:
    name: Publish @roadraven/core to npm
    # Disabled for v0.5.0 alpha — npm trusted publishers not configured yet.
    if: false
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install workspace dependencies
        run: bun install
      - name: Build @roadraven/core (tsup → dist/)
        run: bun run --cwd packages/core build
      # CLAUDE.md exception: `npm publish` is the only authorized npm CLI usage.
      # Bun's publish lacks first-class provenance support; npm CLI is the registry
      # client with mature OIDC trusted-publishing integration (R-03). Using `bunx
      # npm publish` defeats the OIDC env wiring that actions/setup-node provides
      # (RESEARCH.md Pitfall 1). Use `npm publish` directly.
      - name: Publish @roadraven/core to npm with provenance (OIDC)
        run: npm publish --access public --provenance
        working-directory: packages/core

  publish-npm-mcp:
    name: Publish @roadraven/mcp to npm
    # Disabled until @roadraven/mcp exists on npm with a trusted publisher
    # configured for this workflow — the first publish has to be manual, and an
    # OIDC publish without that setup fails the release run. Remove this line
    # once npmjs.com → package → Settings → Trusted Publisher is filled in.
    if: false
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install workspace dependencies
        run: bun install
      - name: Build @roadraven/mcp (bun build → dist/)
        run: bun run --cwd plugins/claude-code build
      # Same CLAUDE.md exception as publish-npm-core above.
      - name: Publish @roadraven/mcp to npm with provenance (OIDC)
        run: npm publish --access public --provenance
        working-directory: plugins/claude-code

  deploy-docs:
    name: Deploy docs site to GitHub Pages
    # Gated on tag push (defense-in-depth — the workflow trigger is already
    # tag-only, but explicit gate documents intent and protects against future
    # workflow_dispatch additions).
    # Disabled for v0.5.0 alpha — GitHub Pages source not set to "GitHub Actions" yet.
    if: false
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test GH Pages site is live
        run: |
          # Wait briefly for Pages CDN to propagate, then verify the site responds.
          sleep 10
          curl -fsSL "https://shuffzord.github.io/RoadRaven/" | grep -q "RoadRaven" || (echo "GH Pages site did not return RoadRaven content"; exit 1)
